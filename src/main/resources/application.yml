server:
  port: 8080

spring:
  application:
    name: smartpark
  datasource:
    url: jdbc:h2:mem:smartpark;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true

smartpark:
  auth:
    username: admin
    password: password
  jwt:
    secret: "ThisIsASecretKeyForSmartParkJwtTokenGeneration1234567890"
    expiration-ms: 3600000
  parking:
    auto-checkout-minutes: 15
    scheduler-fixed-rate-ms: 60000 # run every 1 minute
